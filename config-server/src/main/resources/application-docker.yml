# =========================================================
# APPLICATION
# =========================================================
server:
  port: ${CONFIG_SERVER_PORT}

spring:
  application:
    name: ${CONFIG_SERVER_NAME}

  # =======================================================
  # SPRING CLOUD CONFIG SERVER
  # =======================================================
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_SERVER_URI}
          username: ${GIT_USERNAME}
          password: ${GIT_TOKEN}
          default-label: ${CONFIG_SERVER_DEFAULT_LABEL}
          clone-on-start: true