name: microservices-infra

# ==============================================================================
# INFRAESTRUTURA
# Este ficheiro contém as bases de dados e ferramentas terceiras.
# Estes serviços devem arrancar primeiro, pois os microserviços dependem deles.
# Comando para iniciar: docker-compose -f docker-compose.infra.yml up -d
# ==============================================================================

networks:
  microservices-network:
    name: microservices-network
    driver: bridge

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  keycloak_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  zookeeper_secrets:
    driver: local
  kafka_data:
    driver: local
  kafka_secrets:
    driver: local
  prometheus_data:
    driver: local

services:

  # ---------------------------------------------------------
  # MENSAGERIA E EVENTOS (Apache Kafka & Zookeeper)
  # O Kafka é responsável por toda a comunicação assíncrona
  # ---------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    restart: always
    ports:
    - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,stat,srvr"
    networks:
    - microservices-network
    volumes:
    - zookeeper_data:/var/lib/zookeeper/data
    - zookeeper_log:/var/lib/zookeeper/log
    - zookeeper_secrets:/etc/zookeeper/secrets
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    restart: on-failure
    ports:
    - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 
        PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: 
        PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
    - microservices-network
    volumes:
    - kafka_data:/var/lib/kafka/data
    - kafka_secrets:/etc/kafka/secrets
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ---------------------------------------------------------
  # DEBEZIUM (Change Data Capture / Outbox Pattern)
  # Lê os logs do Postgres e publica no Kafka
  # ---------------------------------------------------------
  debezium-connect:
    image: debezium/connect:2.7.3.Final
    container_name: debezium-connect
    restart: always
    ports:
    - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  debezium-init:
    image: curlimages/curl
    container_name: debezium-init
    depends_on:
      debezium-connect:
        condition: service_healthy
    networks:
    - microservices-network
    volumes:
    - ./debezium-connector.json:/debezium-connector.json
    command: >
      sh -c '
      echo "Waiting for Kafka Connect to start listening on localhost 8083...";
      while : ; do curl_status=$$(curl -s -o /dev/null -w %{http_code} http://debezium-connect:8083/connectors); echo -e $$(date) " Kafka Connect listener HTTP state: " $$curl_status " (waiting for 200)"; if [ "$$curl_status" = "200" ] ; then break; fi; sleep 5; done;
      echo "Kafka Connect is up. Checking if connector already exists...";
      if curl -s http://debezium-connect:8083/connectors | grep -q "outbox-connector"; then
        echo "Connector outbox-connector already exists. Skipping registration.";
      else
        echo "Registering connector...";
        curl -i -X POST -H "Accept:application/json" -H "Content-Type:application/json" http://debezium-connect:8083/connectors -d @/debezium-connector.json;
      fi
      '

  # ---------------------------------------------------------
  # BASES DE DADOS (MySQL, Postgres, MongoDB, Redis)
  # ---------------------------------------------------------
  mysql:
    image: mysql:latest
    container_name: mysql
    restart: always
    ports:
    - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
    - mysql_data:/var/lib/mysql
    - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_ROOT_USER:-root}", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10
      start_period: 300s

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    command: ["postgres", "-c", "wal_level=logical"] # wal_level=logical é necessário para o Debezium (CDC)
    ports:
    - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 300s

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
    - "6379:6379"
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
    - "27017:27017"
    env_file:
    - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
    - mongo_data:/data/db
    - mongo_config:/data/configdb
    networks:
    - microservices-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin || exit 1
      interval: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------------------------------------------------------
  # SEGURANÇA E IDENTIDADE (Keycloak)
  # Serviço de IAM baseado em OIDC/OAuth2
  # ---------------------------------------------------------
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.5.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - "8080:8080"
    env_file:
    - .env
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_SSL_REQUIRED: "NONE"
      KC_IMPORT: /opt/keycloak/data/import/realms.json
      KC_IMPORT_STRATEGY: IGNORE_EXISTING
    command:
    - start-dev
    - --import-realm
    - --hostname-strict=false
    networks:
    - microservices-network
    volumes:
    - keycloak_data:/opt/keycloak/data
    - ./realms:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost:9000\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------------------------------------------------------
  # OBSERVABILIDADE (Zipkin, Prometheus, Grafana)
  # ---------------------------------------------------------
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
    - "9411:9411"
    restart: unless-stopped
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 150m

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
    - "9090:9090"
    volumes:
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    - prometheus_data:/prometheus
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
    - "3000:3000"
    links:
    - prometheus
    environment:
    - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
    - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    networks:
    - microservices-network
    deploy:
      resources:
        limits:
          memory: 512m

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
    - "1025:1025"
    - "8025:8025"
    networks:
    - microservices-network
