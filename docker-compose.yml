#version: '3.9'

networks:
  microservices-network:
    driver: bridge

volumes:
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local
  mongo_data:
    driver: local
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  keycloak_data:
    driver: local
  realms:
    driver: local
  keycloak_certs:

services:

  # ==========================================
  # INFRASTRUCTURE (Zookeeper & Kafka)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    restart: always
    ports:
    - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
    - microservices-network
    deploy:
      resources:
        limits:
          memory: 350m

    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    restart: on-failure
    ports:
    - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 
        PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: 
        PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
    - microservices-network
    deploy:
      resources:
        limits:
          memory: 350m

    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================
  # DATABASES (MySQL, Postgres, MongoDB)
  # ==========================================
  mysql:
    image: mysql:latest
    container_name: mysql
    restart: always
    ports:
    - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
    - mysql_data:/var/lib/mysql
    - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_ROOT_USER:-root}",
        "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    ports:
    - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 30s

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
    - "27017:27017"
    env_file:
    - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
    - mongo_data:/data/db
    networks:
    - microservices-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet 
        mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin
        || exit 1
      interval: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 350m

  # ==========================================
  # SECURITY (Keycloak)
  # ==========================================
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.5.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - "8080:8080"
    env_file:
    - .env
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_SSL_REQUIRED: "NONE"
      KC_IMPORT: /opt/keycloak/data/import/realms.json
      KC_IMPORT_STRATEGY: IGNORE_EXISTING
    command:
    - start-dev
    - --import-realm
    - --hostname-strict=false
    networks:
    - microservices-network
    volumes:
    - keycloak_data:/opt/keycloak/data
    - ./realms:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost:9000\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m


  # ==========================================
  # OBSERVABILITY (Zipkin, Prometheus, Grafana)
  # ==========================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
    - "9411:9411"
    restart: unless-stopped
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 150m

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
    - "9090:9090"
    volumes:
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
    - "3000:3000"
    links:
    - prometheus
    environment:
    - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
    - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    networks:
    - microservices-network
    deploy:
      resources:
        limits:
          memory: 350m

  # ==========================================
  # CORE SERVICES (Config & Discovery Server)
  # ==========================================
  config-server:
    image: config-server:latest
    container_name: config-server
    restart: always
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./config-server/Dockerfile
    develop:
      watch:
      - path: ./config-server
        action: rebuild
    env_file:
    - .env
    ports:
    - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 350m

  discovery-server:
    image: discovery-server:latest
    platform: linux/amd64
    container_name: discovery-server
    restart: always
    build:
      context: .
      dockerfile: ./discovery-server/Dockerfile
    develop:
      watch:
      - path: ./discovery-server
        action: rebuild
    env_file:
    - .env
    ports:
    - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 350m

    depends_on:
      config-server:
        condition: service_healthy
  api-gateway:
    image: api-gateway:latest
    platform: linux/amd64
    container_name: api-gateway
    restart: always
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    env_file:
    - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
    networks:
    - microservices-network
    ports:
    - "8181:8080"
    expose:
    - "8181"
    depends_on:
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m

  # ==========================================
  # BUSINESS MICROSERVICES
  # ==========================================
  order-service:
    image: order-service:latest
    platform: linux/amd64
    container_name: order-service
    restart: always
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    env_file:
    - .env
    depends_on:
      api-gateway:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m

  inventory-service:
    image: inventory-service:latest
    platform: linux/amd64
    container_name: inventory-service
    restart: always
    build:
      context: .
      dockerfile: ./inventory-service/Dockerfile
    env_file:
    - .env
    depends_on:
      api-gateway:
        condition: service_healthy
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: TRACE
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m

  notification-service:
    image: notification-service:latest
    platform: linux/amd64
    container_name: notification-service
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    env_file:
    - .env
    depends_on:
      kafka:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: trace
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m

  product-service:
    image: product-service:latest
    platform: linux/amd64
    container_name: product-service
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./product-service/Dockerfile
    env_file:
    - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: trace
    depends_on:
      mongo:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m

  user-service:
    image: user-service:latest
    platform: linux/amd64
    container_name: user-service
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    env_file:
    - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: trace
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
    - microservices-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m
