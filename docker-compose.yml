  # 🔐 Keycloak - Ambiente DEV
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.5.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"   # HTTP para DEV
    env_file:
      - .env
    environment:
      # ---------------------------
      # Base de Dados
      # ---------------------------
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}              # Ex: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}     # Ex: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD} # Ex: password

      # ---------------------------
      # Admin Inicial
      # ---------------------------
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # ---------------------------
      # DEV Settings
      # ---------------------------
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_SSL_REQUIRED: "NONE"

      # ---------------------------
      # Realm Import (opcional)
      # ---------------------------
      KC_IMPORT: /opt/keycloak/data/import/realms.json
      KC_IMPORT_STRATEGY: IGNORE_EXISTING

    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false

    networks:
      - microservices-network
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realms:/opt/keycloak/data/import   # Se quiser importar realms
    deploy:
      resources:
        limits:
          memory: 512m

  #    ⚙️ Core Backend Services
  #    •  Config-server
  #    •  discovery-server
  #    •  api-gateway
  #    •  order-service
  #    •  inventory-service
  #    •  notification-service
  #    •  product-service

  config-server:
#    image: arseniolourenco/config-server:latest
#    pull_policy: always
    image: config-server:latest
    container_name: config-server
    restart: always
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./config-server/Dockerfile
    develop:
      watch:
        - path: ./config-server
          action: rebuild
    env_file:
      - .env
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_REPO_URI: ${CONFIG_SERVER_URI}
      CONFIG_REPO_USERNAME: ${GIT_USERNAME}
      CONFIG_REPO_PASSWORD: ${GIT_TOKEN}
      CONFIG_REPO_DEFAULT_LABEL: ${CONFIG_SERVER_DEFAULT_LABEL}
    networks:
      - microservices-network
    deploy:
      resources:
        limits:
          memory: 350m

  discovery-server:
#    image: arseniolourenco/discovery-server:latest
#    pull_policy: always
    image: discovery-server:latest
    platform: linux/amd64
    container_name: discovery-server
    restart: always
    build:
      context: .
      dockerfile: ./discovery-server/Dockerfile
    develop:
      watch:
        - path: ./discovery-server
          action: rebuild
    env_file:
      - .env
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health" ]
      interval: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 350m

  # ✅ API Gateway
  api-gateway:
#    image: arseniolourenco/api-gateway:latest
#    pull_policy: always
    image: api-gateway:latest
    platform: linux/amd64
    container_name: api-gateway
    restart: always
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
    networks:
      - microservices-network
    ports:
      - "8181:8080"
    expose:
      - "8181"
    depends_on:
      discovery-server:
        condition: service_started
      keycloak:
        condition: service_started
      zipkin:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m

  # ✅ Order Service
  order-service:
#    image: arseniolourenco/order-service:latest
#    pull_policy: always
    image: order-service:latest
    platform: linux/amd64
    container_name: order-service
    restart: always
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    env_file:
      - .env
    depends_on:
      api-gateway:
        condition: service_started  # Waits for API Gateway to start
      discovery-server:
        condition: service_started
    #    ports:
    #      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m

  # ✅ Inventory Service
  inventory-service:
#    image: arseniolourenco/inventory-service:latest
#    pull_policy: always
    image: inventory-service:latest
    platform: linux/amd64
    container_name: inventory-service
    restart: always
    build:
      context: .
      dockerfile: ./inventory-service/Dockerfile
#    ports:
#      - "8083:8080"
    env_file:
      - .env
    depends_on:
      api-gateway:
        condition: service_started
      mysql:
        condition: service_started
    #      config-server:
    #        condition: service_started  # ✅ Ensure Config Server is ready before starting
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: TRACE
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m

  # ✅ Notification Service
  notification-service:
#    image: arseniolourenco/notification-service:latest
#    pull_policy: always
    image: notification-service:latest
    platform: linux/amd64
    container_name: notification-service
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    #    ports:
    #      - "8085:8080"
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_started
      api-gateway:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: trace
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m

  # ✅ Product Service
  product-service:
#    image: arseniolourenco/product-service:latest
#    pull_policy: always
    image: product-service:latest
    platform: linux/amd64
    container_name: product-service
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./product-service/Dockerfile
    #    ports:
    #      - "8084:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: ${CONFIG_SERVER_IMPORT}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: trace
    depends_on:
      mongo:
        condition: service_started  # ✅ Ensures MongoDB is ready before starting
      discovery-server:
        condition: service_started
      api-gateway:
        condition: service_started
      config-server:
        condition: service_started  # ✅ Ensure Config Server is ready before starting
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - order-service
      - product-service
      - inventory-service
      - notification-service
      - api-gateway
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 350m

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    links:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - microservices-network
    deploy:
      resources:
        limits:
          memory: 350m

# ✅ Define the Docker Network
networks:
  microservices-network:
    driver: bridge

# ✅ Define Persistent Named Volumes
volumes:
  kafka_data: # ✅ Kafka message storage
    driver: local
  zookeeper_data: # ✅ Zookeeper metadata storage
    driver: local
  mongo_data: # ✅ MongoDB persistent storage
    driver: local
  mysql_data: # ✅ MySQL database storage
    driver: local
  postgres_data: # ✅ PostgreSQL database storage
    driver: local
  keycloak_data: # ✅ Keycloak persistent storage
    driver: local
  realms:
    driver: local
  keycloak_certs:
