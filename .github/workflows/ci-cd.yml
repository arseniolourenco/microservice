name: Microservices CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: maven

      - name: Run Maven Tests
        run: ./mvnw clean test

  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    # Define as permissoes necessarias para o GITHUB_TOKEN fazer push para o GHCR e para submeter dependencias
    permissions:
      contents: write
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        service: 
          - discovery-server
          - api-gateway
          - inventory-service
          - order-service
          - product-service
          - notification-service
          - config-server
          - user-service
          - auth-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Submit Dependencies to GitHub
        uses: github/dependency-submission-action@v4
        with:
          working-directory: ${{ matrix.service }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        # So faz login se estivermos na branch main (evita erros em PRs de forks)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          # O contexto e a raiz do repositorio para que o COPY pom.xml e os outros poms funcionem
          file: ./${{ matrix.service }}/Dockerfile
          # So faz push se for um commit direto para a main branch (nao pusha em Pull Requests)
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Usar cache do docker buildx para builds mais rapidos
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
