name: Microservices CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway: 'api-gateway/**'
            auth-service: 'auth-service/**'
            config-server: 'config-server/**'
            discovery-server: 'discovery-server/**'
            inventory-service: 'inventory-service/**'
            notification-service: 'notification-service/**'
            order-service: 'order-service/**'
            product-service: 'product-service/**'
            user-service: 'user-service/**'
            global:
              - 'pom.xml'
              - '.github/workflows/ci-cd.yml'

      - name: Set Matrix
        id: set-matrix
        run: |
          if [ "${{ steps.filter.outputs.global }}" == "true" ]; then
            echo 'matrix=["api-gateway", "auth-service", "config-server", "discovery-server", "inventory-service", "notification-service", "order-service", "product-service", "user-service"]' >> $GITHUB_OUTPUT
          else
            # Extract JSON array of changed filters
            CHANGES='${{ toJSON(steps.filter.outputs.changes) }}'
            # If CHANGES is null or empty brackets, we'll output []
            echo "matrix=$CHANGES" >> $GITHUB_OUTPUT
          fi

  test:
    name: Run Tests
    needs: changes
    if: ${{ needs.changes.outputs.matrix != '[]' && needs.changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: maven

      - name: Run Maven Tests for ${{ matrix.service }}
        run: ./mvnw test -pl ${{ matrix.service }} -am

  build-and-push:
    name: Build & Push Docker Images
    needs: [changes, test]
    if: ${{ needs.changes.outputs.matrix != '[]' && needs.changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Submit Dependencies to GitHub
        uses: advanced-security/maven-dependency-submission-action@v4.1.1
        with:
          working-directory: ${{ matrix.service }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
