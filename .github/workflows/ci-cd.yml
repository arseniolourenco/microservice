name: Microservices CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.services }}

    steps:
      - uses: actions/checkout@v4

      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api-gateway:
              - "api-gateway/**"

            auth-service:
              - "auth-service/**"

            config-server:
              - "config-server/**"

            discovery-server:
              - "discovery-server/**"

            inventory-service:
              - "inventory-service/**"

            notification-service:
              - "notification-service/**"

            order-service:
              - "order-service/**"

            product-service:
              - "product-service/**"

            user-service:
              - "user-service/**"

            global:
              - "pom.xml"
              - ".github/workflows/**"

      - id: matrix
        shell: bash
        run: |

          SERVICES=(
            api-gateway
            auth-service
            config-server
            discovery-server
            inventory-service
            notification-service
            order-service
            product-service
            user-service
          )

          if [[ "${{ steps.changes.outputs.global }}" == "true" ]]; then

            printf -v JSON '%s",' "${SERVICES[@]}"
            JSON="[\"${JSON//,/\",\"}"
            JSON="${JSON%\"}"
            echo "services=$JSON" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          RESULT=()

          for service in "${SERVICES[@]}"
          do
            if [[ "${{ steps.changes.outputs[service] }}" == "true" ]]; then
              RESULT+=("\"$service\"")
            fi
          done

          echo "services=[$(IFS=,; echo "${RESULT[*]}")]" >> "$GITHUB_OUTPUT"

  test:

    name: Test

    needs: detect-changes

    if: ${{ needs.detect-changes.outputs.matrix != '[]' }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:

      - uses: actions/checkout@v4

      - run: chmod +x mvnw

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
          cache: maven

      - name: Verify
        run: |
          ./mvnw verify \
          -pl ${{ matrix.service }} \
          -am

  docker:

    name: Docker Build

    needs:
      - detect-changes
      - test

    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.matrix != '[]'

    runs-on: ubuntu-latest

    strategy:

      fail-fast: false

      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:

      - uses: actions/checkout@v4

      - run: chmod +x mvnw

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21
          cache: maven

      - name: Package
        run: |
          ./mvnw package \
          -pl ${{ matrix.service }} \
          -am \
          -DskipTests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}